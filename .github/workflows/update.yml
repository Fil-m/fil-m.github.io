name: Update pages hub

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "pages-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html pages.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: оновлення хабу сторінок"
            git push
          fi
